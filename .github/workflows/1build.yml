          cat << 'EOF' > app/src/main/java/com/performance/gpstimer/TimingEngine.kt
          package com.performance.gpstimer
          
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.sqrt
          
          enum class TestKind { DISTANCE, ACCEL_SPEED, ROLL_SPEED, BRAKING }
          
          enum class TestMode(
              val title: String,
              val subtitle: String,
              val kind: TestKind,
              val targetDistanceM: Double = 0.0,
              val startSpeedKmh: Double = 0.0,
              val finishSpeedKmh: Double = 0.0,
              val hasTree: Boolean = false
          ) {
              QUARTER_MILE("1/4 MILE", "402.34 m · drag timeslip", TestKind.DISTANCE, targetDistanceM = 402.336),
              HALF_MILE("1/2 MILE", "804.67 m · standing start", TestKind.DISTANCE, targetDistanceM = 804.672),
              MILE("1 MILE", "1,609.34 m · standing start", TestKind.DISTANCE, targetDistanceM = 1609.344),
              ZERO_TO_100("0–100 KM/H", "Standing-start acceleration", TestKind.ACCEL_SPEED, startSpeedKmh = 0.0, finishSpeedKmh = 100.0),
              ZERO_TO_60_MPH("0–60 MPH", "Standing-start acceleration", TestKind.ACCEL_SPEED, startSpeedKmh = 0.0, finishSpeedKmh = 96.5606),
              ROLL_100_200("100–200 KM/H", "Rolling acceleration", TestKind.ROLL_SPEED, startSpeedKmh = 100.0, finishSpeedKmh = 200.0),
              ROLL_60_130_MPH("60–130 MPH", "Rolling acceleration", TestKind.ROLL_SPEED, startSpeedKmh = 96.5606, finishSpeedKmh = 209.214),
              BRAKE_100_0("100–0 KM/H", "Braking time + stopping distance", TestKind.BRAKING, startSpeedKmh = 100.0, finishSpeedKmh = 0.0),
              BRAKE_60_0_MPH("60–0 MPH", "Braking time + stopping distance", TestKind.BRAKING, startSpeedKmh = 96.5606, finishSpeedKmh = 0.0),
              DRAG_TREE("DRAG TREE", "1/4 mile · amber sequence + reaction time", TestKind.DISTANCE, targetDistanceM = 402.336, hasTree = true)
          }
          
          enum class RunStatus(val label: String) {
              IDLE("DISARMED"),
              STAGED_STOP("STAGED · READY TO LAUNCH"),
              STAGED_ROLL("ARMED · WAIT FOR START SPEED"),
              STAGED_BRAKE("ARMED · ACCELERATE ABOVE TARGET FIRST"),
              RUNNING("TIMING IN PROGRESS"),
              COMPLETED("RUN COMPLETE")
          }
          
          data class GpsSample(
              val elapsedNanos: Long,
              val speedMps: Double,
              val speedKmh: Double,
              val cumulativeDistanceM: Double,
              val altitudeM: Double,
              val accuracyM: Float,
              val longitudinalG: Double
          )
          
          object TimingConstants {
              const val ONE_FOOT_M = 0.3048
              const val DIST_60_FT_M = 18.288
              const val DIST_330_FT_M = 100.584
              const val DIST_EIGHTH_MILE_M = 201.168
              const val DIST_1000_FT_M = 304.800
              const val DIST_QUARTER_MILE_M = 402.336
              const val LAUNCH_SPEED_THRESHOLD_KMH = 1.8
              const val STOP_SPEED_THRESHOLD_KMH = 1.8
          }
          
          object TimingMath {
              fun interpolateTimeAtSpeed(s1: GpsSample, s2: GpsSample, targetSpeedKmh: Double): Long {
                  val dv = s2.speedKmh - s1.speedKmh
                  if (abs(dv) < 1e-6) return s2.elapsedNanos
                  val fraction = ((targetSpeedKmh - s1.speedKmh) / dv).coerceIn(0.0, 1.0)
                  return s1.elapsedNanos + ((s2.elapsedNanos - s1.elapsedNanos) * fraction).toLong()
              }
          
              fun interpolateDistanceAtSpeed(s1: GpsSample, s2: GpsSample, targetSpeedKmh: Double): Double {
                  val crossNanos = interpolateTimeAtSpeed(s1, s2, targetSpeedKmh)
                  val dt = (crossNanos - s1.elapsedNanos) / 1_000_000_000.0
                  val totalDt = (s2.elapsedNanos - s1.elapsedNanos) / 1_000_000_000.0
                  if (totalDt <= 0.0) return s2.cumulativeDistanceM
                  val acceleration = (s2.speedMps - s1.speedMps) / totalDt
                  return s1.cumulativeDistanceM + s1.speedMps * dt + 0.5 * acceleration * dt * dt
              }
          
              fun interpolateAltitudeAtSpeed(s1: GpsSample, s2: GpsSample, targetSpeedKmh: Double): Double {
                  val dv = s2.speedKmh - s1.speedKmh
                  if (abs(dv) < 1e-6) return s2.altitudeM
                  val fraction = ((targetSpeedKmh - s1.speedKmh) / dv).coerceIn(0.0, 1.0)
                  return s1.altitudeM + (s2.altitudeM - s1.altitudeM) * fraction
              }
          
              fun interpolateTimeAtDistance(s1: GpsSample, s2: GpsSample, targetDistanceM: Double): Long {
                  val dx = s2.cumulativeDistanceM - s1.cumulativeDistanceM
                  if (dx <= 1e-6) return s2.elapsedNanos
                  val remaining = (targetDistanceM - s1.cumulativeDistanceM).coerceIn(0.0, dx)
                  val dtSec = (s2.elapsedNanos - s1.elapsedNanos) / 1_000_000_000.0
                  if (dtSec <= 0.0) return s2.elapsedNanos
                  val v0 = s1.speedMps
                  val acceleration = 2.0 * (dx - v0 * dtSec) / (dtSec * dtSec)
                  val tSec = if (abs(acceleration) < 1e-4) {
                      if (v0 > 1e-3) remaining / v0 else dtSec * remaining / dx
                  } else {
                      val discriminant = max(0.0, v0 * v0 + 2.0 * acceleration * remaining)
                      val root = (-v0 + sqrt(discriminant)) / acceleration
                      if (root in 0.0..dtSec) root else dtSec * remaining / dx
                  }
                  return s1.elapsedNanos + (tSec * 1_000_000_000.0).toLong()
              }
          
              fun interpolateSpeedAtDistance(s1: GpsSample, s2: GpsSample, targetDistanceM: Double): Double {
                  val cross = interpolateTimeAtDistance(s1, s2, targetDistanceM)
                  val dt = (s2.elapsedNanos - s1.elapsedNanos).toDouble()
                  if (dt <= 0.0) return s2.speedKmh
                  val fraction = ((cross - s1.elapsedNanos) / dt).coerceIn(0.0, 1.0)
                  return s1.speedKmh + (s2.speedKmh - s1.speedKmh) * fraction
              }
          
              fun interpolateAltitudeAtDistance(s1: GpsSample, s2: GpsSample, targetDistanceM: Double): Double {
                  val dx = s2.cumulativeDistanceM - s1.cumulativeDistanceM
                  if (dx <= 1e-6) return s2.altitudeM
                  val fraction = ((targetDistanceM - s1.cumulativeDistanceM) / dx).coerceIn(0.0, 1.0)
                  return s1.altitudeM + (s2.altitudeM - s1.altitudeM) * fraction
              }
          
              fun calculateSlopePercent(startAltM: Double, endAltM: Double, distanceM: Double): Double {
                  if (distanceM < 10.0) return 0.0
                  return ((endAltM - startAltM) / distanceM) * 100.0
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/performance/gpstimer/RunDatabase.kt
          package com.performance.gpstimer
          
          import android.content.Context
          import androidx.room.*
          import androidx.sqlite.db.SupportSQLiteDatabase
          import androidx.room.migration.Migration
          import kotlinx.coroutines.flow.Flow
          
          @Entity(tableName = "performance_runs")
          data class RunRecord(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val timestampEpochMs: Long,
              val testMode: String,
              val primaryTimeMs: Long,
              val trapSpeedKmh: Double,
              val totalDistanceM: Double,
              val time60ftMs: Long? = null,
              val time330ftMs: Long? = null,
              val timeEighthMileMs: Long? = null,
              val speedEighthMileKmh: Double? = null,
              val time1000ftMs: Long? = null,
              val time0to100Ms: Long? = null,
              val time100to150Ms: Long? = null,
              val time150to200Ms: Long? = null,
              val slopePercent: Double,
              val isValidSlope: Boolean,
              val peakG: Double,
              val rolloutEnabled: Boolean,
              val gpsHz: Double,
              val reactionTimeMs: Long? = null
          )
          
          @Dao
          interface RunDao {
              @Query("SELECT * FROM performance_runs ORDER BY timestampEpochMs DESC")
              fun getAllRuns(): Flow<List<RunRecord>>
          
              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertRun(run: RunRecord): Long
          
              @Delete
              suspend fun deleteRun(run: RunRecord)
          }
          
          @Database(entities = [RunRecord::class], version = 2, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun runDao(): RunDao
          
              companion object {
                  private val MIGRATION_1_2 = object : Migration(1, 2) {
                      override fun migrate(db: SupportSQLiteDatabase) {
                          db.execSQL("ALTER TABLE performance_runs ADD COLUMN reactionTimeMs INTEGER")
                      }
                  }
          
                  @Volatile private var INSTANCE: AppDatabase? = null
          
                  fun getInstance(context: Context): AppDatabase {
                      return INSTANCE ?: synchronized(this) {
                          INSTANCE ?: Room.databaseBuilder(
                              context.applicationContext,
                              AppDatabase::class.java,
                              "gps_drag_timer.db"
                          ).addMigrations(MIGRATION_1_2).build().also { INSTANCE = it }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/performance/gpstimer/GpsTelemetryService.kt
          package com.performance.gpstimer
          
          import android.annotation.SuppressLint
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.location.GnssStatus
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.os.Binder
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch
          import kotlin.math.abs
          import kotlin.math.max
          
          data class TelemetryUiState(
              val mode: TestMode = TestMode.QUARTER_MILE,
              val status: RunStatus = RunStatus.IDLE,
              val rolloutEnabled: Boolean = true,
              val currentSpeedKmh: Double = 0.0,
              val currentG: Double = 0.0,
              val peakG: Double = 0.0,
              val liveElapsedMs: Long = 0L,
              val liveDistanceM: Double = 0.0,
              val satellitesUsed: Int = 0,
              val satellitesVisible: Int = 0,
              val accuracyM: Float = 0f,
              val currentHz: Double = 0.0,
              val reactionTimeMs: Long? = null,
              val latestRun: RunRecord? = null
          )
          
          class GpsTelemetryService : Service(), LocationListener {
              private val binder = LocalBinder()
              private val serviceScope = CoroutineScope(SupervisorJob() + Dispatchers.Default)
              private lateinit var locationManager: LocationManager
              private lateinit var database: AppDatabase
              private var wakeLock: PowerManager.WakeLock? = null
          
              private val _uiState = MutableStateFlow(TelemetryUiState())
              val uiState: StateFlow<TelemetryUiState> = _uiState.asStateFlow()
          
              private var prevSample: GpsSample? = null
              private var cumulativeDistanceM = 0.0
              private var stagingOriginDistanceM = 0.0
              private var runStartTimeNanos = 0L
              private var runStartDistanceM = 0.0
              private var runStartAltitudeM = 0.0
              private var launchMovementNanos = 0L
              private var treeGreenTimeNanos: Long? = null
              private var recentFixTimesNanos = ArrayDeque<Long>(12)
              private var split60ftMs: Long? = null
              private var split330ftMs: Long? = null
              private var splitEighthMs: Long? = null
              private var speedEighthKmh: Double? = null
              private var split1000ftMs: Long? = null
              private var split0to100Ms: Long? = null
              private var split100to150Ms: Long? = null
              private var split150to200Ms: Long? = null
              private var timeAt150Nanos: Long? = null
              private var peakRunG = 0.0
          
              inner class LocalBinder : Binder() {
                  fun getService(): GpsTelemetryService = this@GpsTelemetryService
              }
          
              override fun onBind(intent: Intent?): IBinder = binder
          
              override fun onCreate() {
                  super.onCreate()
                  database = AppDatabase.getInstance(this)
                  locationManager = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  acquireWakeLock()
                  startForegroundServiceNotification()
                  startRawGpsUpdates()
              }
          
              private val gnssCallback = object : GnssStatus.Callback() {
                  override fun onSatelliteStatusChanged(status: GnssStatus) {
                      var used = 0
                      for (i in 0 until status.satelliteCount) if (status.usedInFix(i)) used++
                      _uiState.value = _uiState.value.copy(satellitesUsed = used, satellitesVisible = status.satelliteCount)
                  }
              }
          
              @SuppressLint("MissingPermission")
              fun startRawGpsUpdates() {
                  try {
                      locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 0L, 0f, this, Looper.getMainLooper())
                      locationManager.registerGnssStatusCallback(gnssCallback, Handler(Looper.getMainLooper()))
                  } catch (_: SecurityException) {
                      // The activity requests permission before the user can start a run.
                  } catch (_: IllegalArgumentException) {
                      // Device has no GPS provider available.
                  }
              }
          
              fun setTestMode(mode: TestMode) {
                  disarmRun()
                  resetRunMetrics()
                  _uiState.value = _uiState.value.copy(mode = mode, latestRun = null, reactionTimeMs = null)
              }
          
              fun toggleRollout(enabled: Boolean) {
                  _uiState.value = _uiState.value.copy(rolloutEnabled = enabled)
              }
          
              fun armSystem() {
                  resetRunMetrics()
                  val state = _uiState.value
                  val nextStatus = when (state.mode.kind) {
                      TestKind.DISTANCE, TestKind.ACCEL_SPEED -> RunStatus.STAGED_STOP
                      TestKind.ROLL_SPEED -> RunStatus.STAGED_ROLL
                      TestKind.BRAKING -> RunStatus.STAGED_BRAKE
                  }
                  _uiState.value = state.copy(
                      status = nextStatus,
                      liveElapsedMs = 0L,
                      liveDistanceM = 0.0,
                      peakG = 0.0,
                      reactionTimeMs = null,
                      latestRun = null
                  )
              }
          
              fun disarmRun() {
                  resetRunMetrics()
                  _uiState.value = _uiState.value.copy(
                      status = RunStatus.IDLE,
                      liveElapsedMs = 0L,
                      liveDistanceM = 0.0,
                      reactionTimeMs = null
                  )
              }
          
              fun notifyTreeGreen(greenRealtimeNanos: Long) {
                  treeGreenTimeNanos = greenRealtimeNanos
                  if (launchMovementNanos > 0L) {
                      val reaction = (launchMovementNanos - greenRealtimeNanos) / 1_000_000L
                      _uiState.value = _uiState.value.copy(reactionTimeMs = reaction)
                  }
              }
          
              private fun resetRunMetrics() {
                  runStartTimeNanos = 0L
                  runStartDistanceM = cumulativeDistanceM
                  runStartAltitudeM = prevSample?.altitudeM ?: 0.0
                  stagingOriginDistanceM = cumulativeDistanceM
                  launchMovementNanos = 0L
                  treeGreenTimeNanos = null
                  split60ftMs = null
                  split330ftMs = null
                  splitEighthMs = null
                  speedEighthKmh = null
                  split1000ftMs = null
                  split0to100Ms = null
                  split100to150Ms = null
                  split150to200Ms = null
                  timeAt150Nanos = null
                  peakRunG = 0.0
              }
          
              override fun onLocationChanged(location: Location) {
                  val nowNanos = location.elapsedRealtimeNanos
                  val rawSpeedMps = if (location.hasSpeed()) location.speed.toDouble() else 0.0
                  val speedMps = if (rawSpeedMps < 0.33) 0.0 else rawSpeedMps
                  val speedKmh = speedMps * 3.6
                  val altitudeM = if (location.hasAltitude()) location.altitude else 0.0
                  val accuracyM = if (location.hasAccuracy()) location.accuracy else 99f
          
                  recentFixTimesNanos.addLast(nowNanos)
                  if (recentFixTimesNanos.size > 10) recentFixTimesNanos.removeFirst()
                  val hz = if (recentFixTimesNanos.size >= 2) {
                      val span = (recentFixTimesNanos.last() - recentFixTimesNanos.first()) / 1_000_000_000.0
                      if (span > 0.0) (recentFixTimesNanos.size - 1) / span else 0.0
                  } else 0.0
          
                  val previous = prevSample
                  var longitudinalG = 0.0
                  if (previous != null) {
                      val dtSec = (nowNanos - previous.elapsedNanos) / 1_000_000_000.0
                      if (dtSec in 0.005..5.0) {
                          cumulativeDistanceM += 0.5 * (previous.speedMps + speedMps) * dtSec
                          longitudinalG = ((speedMps - previous.speedMps) / dtSec) / 9.80665
                      }
                  }
          
                  val current = GpsSample(nowNanos, speedMps, speedKmh, cumulativeDistanceM, altitudeM, accuracyM, longitudinalG)
                  if (previous != null) processStateMachine(previous, current, hz)
                  prevSample = current
                  _uiState.value = _uiState.value.copy(
                      currentSpeedKmh = speedKmh,
                      currentG = longitudinalG,
                      accuracyM = accuracyM,
                      currentHz = hz
                  )
              }
          
              private fun processStateMachine(s1: GpsSample, s2: GpsSample, hz: Double) {
                  val state = _uiState.value
                  when (state.mode.kind) {
                      TestKind.DISTANCE -> processDistanceMode(state, s1, s2, hz)
                      TestKind.ACCEL_SPEED -> processAccelerationMode(state, s1, s2, hz)
                      TestKind.ROLL_SPEED -> processRollMode(state, s1, s2, hz)
                      TestKind.BRAKING -> processBrakingMode(state, s1, s2, hz)
                  }
              }
          
              private fun crossedUp(s1: GpsSample, s2: GpsSample, speedKmh: Double): Boolean =
                  s1.speedKmh < speedKmh && s2.speedKmh >= speedKmh
          
              private fun crossedDown(s1: GpsSample, s2: GpsSample, speedKmh: Double): Boolean =
                  s1.speedKmh > speedKmh && s2.speedKmh <= speedKmh
          
              private fun noteLaunchMovement(s1: GpsSample, s2: GpsSample) {
                  if (launchMovementNanos == 0L && crossedUp(s1, s2, TimingConstants.LAUNCH_SPEED_THRESHOLD_KMH)) {
                      launchMovementNanos = TimingMath.interpolateTimeAtSpeed(s1, s2, TimingConstants.LAUNCH_SPEED_THRESHOLD_KMH)
                      treeGreenTimeNanos?.let { green ->
                          _uiState.value = _uiState.value.copy(reactionTimeMs = (launchMovementNanos - green) / 1_000_000L)
                      }
                  }
              }
          
              private fun processDistanceMode(state: TelemetryUiState, s1: GpsSample, s2: GpsSample, hz: Double) {
                  if (state.status == RunStatus.STAGED_STOP) {
                      if (s2.speedKmh < TimingConstants.LAUNCH_SPEED_THRESHOLD_KMH) {
                          stagingOriginDistanceM = s2.cumulativeDistanceM
                          return
                      }
                      noteLaunchMovement(s1, s2)
                      val rollout = state.rolloutEnabled
                      if (!rollout && launchMovementNanos > 0L) {
                          beginRun(launchMovementNanos, TimingMath.interpolateDistanceAtSpeed(s1, s2, TimingConstants.LAUNCH_SPEED_THRESHOLD_KMH),
                              TimingMath.interpolateAltitudeAtSpeed(s1, s2, TimingConstants.LAUNCH_SPEED_THRESHOLD_KMH))
                      } else if (rollout) {
                          val rolloutTarget = stagingOriginDistanceM + TimingConstants.ONE_FOOT_M
                          if (s2.cumulativeDistanceM >= rolloutTarget) {
                              beginRun(
                                  TimingMath.interpolateTimeAtDistance(s1, s2, rolloutTarget),
                                  rolloutTarget,
                                  TimingMath.interpolateAltitudeAtDistance(s1, s2, rolloutTarget)
                              )
                          }
                      }
                  }
                  if (_uiState.value.status == RunStatus.RUNNING) checkDistanceSplits(s1, s2, hz)
              }
          
              private fun beginRun(startNanos: Long, startDistance: Double, startAltitude: Double) {
                  if (_uiState.value.status != RunStatus.STAGED_STOP) return
                  runStartTimeNanos = startNanos
                  runStartDistanceM = startDistance
                  runStartAltitudeM = startAltitude
                  _uiState.value = _uiState.value.copy(status = RunStatus.RUNNING)
              }
          
              private fun checkDistanceSplits(s1: GpsSample, s2: GpsSample, hz: Double) {
                  val mode = _uiState.value.mode
                  peakRunG = max(peakRunG, max(0.0, s2.longitudinalG))
                  val runDistance = max(0.0, s2.cumulativeDistanceM - runStartDistanceM)
                  val elapsedMs = max(0L, (s2.elapsedNanos - runStartTimeNanos) / 1_000_000L)
          
                  fun splitAt(distanceM: Double): Long = max(0L,
                      (TimingMath.interpolateTimeAtDistance(s1, s2, runStartDistanceM + distanceM) - runStartTimeNanos) / 1_000_000L)
          
                  if (split60ftMs == null && runDistance >= TimingConstants.DIST_60_FT_M) split60ftMs = splitAt(TimingConstants.DIST_60_FT_M)
                  if (split330ftMs == null && runDistance >= TimingConstants.DIST_330_FT_M) split330ftMs = splitAt(TimingConstants.DIST_330_FT_M)
                  if (splitEighthMs == null && runDistance >= TimingConstants.DIST_EIGHTH_MILE_M) {
                      val target = runStartDistanceM + TimingConstants.DIST_EIGHTH_MILE_M
                      splitEighthMs = splitAt(TimingConstants.DIST_EIGHTH_MILE_M)
                      speedEighthKmh = TimingMath.interpolateSpeedAtDistance(s1, s2, target)
                  }
                  if (split1000ftMs == null && runDistance >= TimingConstants.DIST_1000_FT_M) split1000ftMs = splitAt(TimingConstants.DIST_1000_FT_M)
                  if (split0to100Ms == null && crossedUp(s1, s2, 100.0) && launchMovementNanos > 0L) {
                      val crossing = TimingMath.interpolateTimeAtSpeed(s1, s2, 100.0)
                      split0to100Ms = max(0L, (crossing - runStartTimeNanos) / 1_000_000L)
                  }
          
                  val target = runStartDistanceM + mode.targetDistanceM
                  if (s2.cumulativeDistanceM >= target) {
                      val finishNanos = TimingMath.interpolateTimeAtDistance(s1, s2, target)
                      val finishSpeed = TimingMath.interpolateSpeedAtDistance(s1, s2, target)
                      val finishAltitude = TimingMath.interpolateAltitudeAtDistance(s1, s2, target)
                      val slope = TimingMath.calculateSlopePercent(runStartAltitudeM, finishAltitude, mode.targetDistanceM)
                      val reaction = _uiState.value.reactionTimeMs
                      saveCompletedRun(RunRecord(
                          timestampEpochMs = System.currentTimeMillis(),
                          testMode = mode.name,
                          primaryTimeMs = max(0L, (finishNanos - runStartTimeNanos) / 1_000_000L),
                          trapSpeedKmh = finishSpeed,
                          totalDistanceM = mode.targetDistanceM,
                          time60ftMs = split60ftMs,
                          time330ftMs = split330ftMs,
                          timeEighthMileMs = splitEighthMs,
                          speedEighthMileKmh = speedEighthKmh,
                          time1000ftMs = split1000ftMs,
                          time0to100Ms = split0to100Ms,
                          slopePercent = slope,
                          isValidSlope = slope >= -1.0,
                          peakG = peakRunG,
                          rolloutEnabled = _uiState.value.rolloutEnabled,
                          gpsHz = hz,
                          reactionTimeMs = reaction
                      ))
                      return
                  }
                  _uiState.value = _uiState.value.copy(liveElapsedMs = elapsedMs, liveDistanceM = runDistance, peakG = peakRunG)
              }
          
              private fun processAccelerationMode(state: TelemetryUiState, s1: GpsSample, s2: GpsSample, hz: Double) {
                  if (state.status == RunStatus.STAGED_STOP) {
                      if (s2.speedKmh < TimingConstants.LAUNCH_SPEED_THRESHOLD_KMH) return
                      noteLaunchMovement(s1, s2)
                      if (launchMovementNanos > 0L && runStartTimeNanos == 0L) {
                          runStartTimeNanos = launchMovementNanos
                          runStartDistanceM = TimingMath.interpolateDistanceAtSpeed(s1, s2, TimingConstants.LAUNCH_SPEED_THRESHOLD_KMH)
                          runStartAltitudeM = TimingMath.interpolateAltitudeAtSpeed(s1, s2, TimingConstants.LAUNCH_SPEED_THRESHOLD_KMH)
                          _uiState.value = _uiState.value.copy(status = RunStatus.RUNNING)
                      }
                  }
                  if (_uiState.value.status != RunStatus.RUNNING) return
                  peakRunG = max(peakRunG, max(0.0, s2.longitudinalG))
                  val mode = _uiState.value.mode
                  if (crossedUp(s1, s2, mode.finishSpeedKmh)) {
                      val finish = TimingMath.interpolateTimeAtSpeed(s1, s2, mode.finishSpeedKmh)
                      val finishDistance = TimingMath.interpolateDistanceAtSpeed(s1, s2, mode.finishSpeedKmh)
                      val finishAltitude = TimingMath.interpolateAltitudeAtSpeed(s1, s2, mode.finishSpeedKmh)
                      val distance = max(0.0, finishDistance - runStartDistanceM)
                      val slope = TimingMath.calculateSlopePercent(runStartAltitudeM, finishAltitude, max(10.0, distance))
                      saveCompletedRun(RunRecord(
                          timestampEpochMs = System.currentTimeMillis(), testMode = mode.name,
                          primaryTimeMs = max(0L, (finish - runStartTimeNanos) / 1_000_000L),
                          trapSpeedKmh = mode.finishSpeedKmh, totalDistanceM = distance,
                          time0to100Ms = if (mode.finishSpeedKmh == 100.0) max(0L, (finish - runStartTimeNanos) / 1_000_000L) else null,
                          slopePercent = slope, isValidSlope = slope >= -1.0, peakG = peakRunG,
                          rolloutEnabled = false, gpsHz = hz, reactionTimeMs = _uiState.value.reactionTimeMs
                      ))
                      return
                  }
                  _uiState.value = _uiState.value.copy(
                      liveElapsedMs = max(0L, (s2.elapsedNanos - runStartTimeNanos) / 1_000_000L),
                      liveDistanceM = max(0.0, s2.cumulativeDistanceM - runStartDistanceM), peakG = peakRunG
                  )
              }
          
              private fun processRollMode(state: TelemetryUiState, s1: GpsSample, s2: GpsSample, hz: Double) {
                  val mode = state.mode
                  if (state.status == RunStatus.STAGED_ROLL && crossedUp(s1, s2, mode.startSpeedKmh)) {
                      runStartTimeNanos = TimingMath.interpolateTimeAtSpeed(s1, s2, mode.startSpeedKmh)
                      runStartDistanceM = TimingMath.interpolateDistanceAtSpeed(s1, s2, mode.startSpeedKmh)
                      runStartAltitudeM = TimingMath.interpolateAltitudeAtSpeed(s1, s2, mode.startSpeedKmh)
                      peakRunG = max(0.0, s2.longitudinalG)
                      _uiState.value = _uiState.value.copy(status = RunStatus.RUNNING)
                  }
                  if (_uiState.value.status != RunStatus.RUNNING) return
                  if (s2.speedKmh < mode.startSpeedKmh - 10.0) {
                      disarmRun()
                      return
                  }
                  peakRunG = max(peakRunG, max(0.0, s2.longitudinalG))
                  if (mode == TestMode.ROLL_100_200 && split100to150Ms == null && crossedUp(s1, s2, 150.0)) {
                      val t150 = TimingMath.interpolateTimeAtSpeed(s1, s2, 150.0)
                      timeAt150Nanos = t150
                      split100to150Ms = max(0L, (t150 - runStartTimeNanos) / 1_000_000L)
                  }
                  if (crossedUp(s1, s2, mode.finishSpeedKmh)) {
                      val finish = TimingMath.interpolateTimeAtSpeed(s1, s2, mode.finishSpeedKmh)
                      val finishDistance = TimingMath.interpolateDistanceAtSpeed(s1, s2, mode.finishSpeedKmh)
                      val finishAltitude = TimingMath.interpolateAltitudeAtSpeed(s1, s2, mode.finishSpeedKmh)
                      val distance = max(0.0, finishDistance - runStartDistanceM)
                      val slope = TimingMath.calculateSlopePercent(runStartAltitudeM, finishAltitude, distance)
                      if (mode == TestMode.ROLL_100_200) {
                          split150to200Ms = timeAt150Nanos?.let { max(0L, (finish - it) / 1_000_000L) }
                      }
                      saveCompletedRun(RunRecord(
                          timestampEpochMs = System.currentTimeMillis(), testMode = mode.name,
                          primaryTimeMs = max(0L, (finish - runStartTimeNanos) / 1_000_000L),
                          trapSpeedKmh = mode.finishSpeedKmh, totalDistanceM = distance,
                          time100to150Ms = split100to150Ms, time150to200Ms = split150to200Ms,
                          slopePercent = slope, isValidSlope = slope >= -1.0, peakG = peakRunG,
                          rolloutEnabled = false, gpsHz = hz
                      ))
                      return
                  }
                  _uiState.value = _uiState.value.copy(
                      liveElapsedMs = max(0L, (s2.elapsedNanos - runStartTimeNanos) / 1_000_000L),
                      liveDistanceM = max(0.0, s2.cumulativeDistanceM - runStartDistanceM), peakG = peakRunG
                  )
              }
          
              private fun processBrakingMode(state: TelemetryUiState, s1: GpsSample, s2: GpsSample, hz: Double) {
                  val mode = state.mode
                  if (state.status == RunStatus.STAGED_BRAKE && crossedDown(s1, s2, mode.startSpeedKmh)) {
                      runStartTimeNanos = TimingMath.interpolateTimeAtSpeed(s1, s2, mode.startSpeedKmh)
                      runStartDistanceM = TimingMath.interpolateDistanceAtSpeed(s1, s2, mode.startSpeedKmh)
                      runStartAltitudeM = TimingMath.interpolateAltitudeAtSpeed(s1, s2, mode.startSpeedKmh)
                      peakRunG = abs(s2.longitudinalG)
                      _uiState.value = _uiState.value.copy(status = RunStatus.RUNNING)
                  }
                  if (_uiState.value.status != RunStatus.RUNNING) return
                  peakRunG = max(peakRunG, abs(s2.longitudinalG))
                  val stopThreshold = TimingConstants.STOP_SPEED_THRESHOLD_KMH
                  if (crossedDown(s1, s2, stopThreshold) || s2.speedKmh <= stopThreshold) {
                      val finish = if (crossedDown(s1, s2, stopThreshold)) TimingMath.interpolateTimeAtSpeed(s1, s2, stopThreshold) else s2.elapsedNanos
                      val finishDistance = if (crossedDown(s1, s2, stopThreshold)) TimingMath.interpolateDistanceAtSpeed(s1, s2, stopThreshold) else s2.cumulativeDistanceM
                      val finishAltitude = if (crossedDown(s1, s2, stopThreshold)) TimingMath.interpolateAltitudeAtSpeed(s1, s2, stopThreshold) else s2.altitudeM
                      val stopDistance = max(0.0, finishDistance - runStartDistanceM)
                      val slope = TimingMath.calculateSlopePercent(runStartAltitudeM, finishAltitude, max(10.0, stopDistance))
                      saveCompletedRun(RunRecord(
                          timestampEpochMs = System.currentTimeMillis(), testMode = mode.name,
                          primaryTimeMs = max(0L, (finish - runStartTimeNanos) / 1_000_000L),
                          trapSpeedKmh = mode.startSpeedKmh, totalDistanceM = stopDistance,
                          slopePercent = slope, isValidSlope = slope >= -1.0, peakG = peakRunG,
                          rolloutEnabled = false, gpsHz = hz
                      ))
                      return
                  }
                  _uiState.value = _uiState.value.copy(
                      liveElapsedMs = max(0L, (s2.elapsedNanos - runStartTimeNanos) / 1_000_000L),
                      liveDistanceM = max(0.0, s2.cumulativeDistanceM - runStartDistanceM), peakG = peakRunG
                  )
              }
          
              private fun saveCompletedRun(record: RunRecord) {
                  serviceScope.launch { database.runDao().insertRun(record) }
                  _uiState.value = _uiState.value.copy(
                      status = RunStatus.COMPLETED,
                      liveElapsedMs = record.primaryTimeMs,
                      liveDistanceM = record.totalDistanceM,
                      peakG = record.peakG,
                      reactionTimeMs = record.reactionTimeMs ?: _uiState.value.reactionTimeMs,
                      latestRun = record
                  )
              }
          
              private fun acquireWakeLock() {
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "GpsDragTimer::WakeLock").apply {
                      acquire(2 * 60 * 60 * 1000L)
                  }
              }
          
              private fun startForegroundServiceNotification() {
                  val channelId = "gps_telemetry_channel"
                  val channel = NotificationChannel(channelId, "High Precision GPS Telemetry", NotificationManager.IMPORTANCE_LOW)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("GPS Performance Timer Active")
                      .setContentText("GPS telemetry is running")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1001, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION)
                  } else {
                      startForeground(1001, notification)
                  }
              }
          
              override fun onProviderDisabled(provider: String) { }
              override fun onProviderEnabled(provider: String) { }
              @Deprecated("Deprecated in Java") override fun onStatusChanged(provider: String?, status: Int, extras: android.os.Bundle?) { }
          
              override fun onDestroy() {
                  locationManager.removeUpdates(this)
                  try { locationManager.unregisterGnssStatusCallback(gnssCallback) } catch (_: Exception) { }
                  wakeLock?.let { if (it.isHeld) it.release() }
                  serviceScope.cancel()
                  super.onDestroy()
              }
          }
