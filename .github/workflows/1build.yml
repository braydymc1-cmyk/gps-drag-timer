                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                                  SummaryChip("UNITS", if (settings.useMph) "MPH" else "KM/H")
                                  SummaryChip("THEME", if (settings.darkTheme) "DARK" else "LIGHT")
                                  SummaryChip("GPS", if (uiState.satellitesUsed >= 6) "LOCKED" else "SEARCHING")
                              }
                          }
                      }
                      Spacer(Modifier.height(14.dp))
                      Text("DRAG & DISTANCE", fontWeight = FontWeight.Bold, fontSize = 12.sp, color = MaterialTheme.colorScheme.primary)
                      Spacer(Modifier.height(6.dp))
                      listOf(TestMode.QUARTER_MILE, TestMode.DRAG_TREE, TestMode.HALF_MILE, TestMode.MILE).forEach { mode ->
                          ModeCard(mode, onClick = { onSelectMode(mode) })
                          Spacer(Modifier.height(8.dp))
                      }
                      Spacer(Modifier.height(7.dp))
                      Text("ACCELERATION", fontWeight = FontWeight.Bold, fontSize = 12.sp, color = MaterialTheme.colorScheme.primary)
                      Spacer(Modifier.height(6.dp))
                      listOf(TestMode.ZERO_TO_100, TestMode.ZERO_TO_60_MPH, TestMode.ROLL_100_200, TestMode.ROLL_60_130_MPH).forEach { mode ->
                          ModeCard(mode, onClick = { onSelectMode(mode) })
                          Spacer(Modifier.height(8.dp))
                      }
                      Spacer(Modifier.height(7.dp))
                      Text("BRAKING", fontWeight = FontWeight.Bold, fontSize = 12.sp, color = MaterialTheme.colorScheme.primary)
                      Spacer(Modifier.height(6.dp))
                      listOf(TestMode.BRAKE_100_0, TestMode.BRAKE_60_0_MPH).forEach { mode ->
                          ModeCard(mode, onClick = { onSelectMode(mode) })
                          Spacer(Modifier.height(8.dp))
                      }
                      Spacer(Modifier.height(8.dp))
                      Text(
                          "GPS-ESTIMATED TIMING · USE ONLY ON A CLOSED COURSE. Not a substitute for official track timing.",
                          color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.62f), fontSize = 10.sp, fontFamily = FontFamily.Monospace
                      )
                      Spacer(Modifier.height(10.dp))
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                      OutlinedButton(onClick = onHistory, modifier = Modifier.weight(1f)) { Icon(Icons.Filled.History, null); Spacer(Modifier.width(5.dp)); Text("RUN LOGS") }
                      OutlinedButton(onClick = onSettings, modifier = Modifier.weight(1f)) { Icon(Icons.Filled.Settings, null); Spacer(Modifier.width(5.dp)); Text("SETTINGS") }
                  }
              }
          }
          
