          @Composable
          private fun RunHistoryScreen(runs: List<RunRecord>, useMph: Boolean, onDeleteRun: (RunRecord) -> Unit, onExportCsv: () -> Unit) {
              Column(modifier = Modifier.fillMaxSize()) {
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Text("SAVED PERFORMANCE RUNS", fontSize = 12.sp, fontWeight = FontWeight.Black, fontFamily = FontFamily.Monospace)
                      Button(onClick = onExportCsv, enabled = runs.isNotEmpty()) {
                          Icon(Icons.Filled.Share, contentDescription = "Export CSV")
                          Spacer(Modifier.width(5.dp))
                          Text("CSV")
                      }
                  }
                  Spacer(Modifier.height(8.dp))
                  if (runs.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("No saved runs yet. Select a mode and complete a test.", color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.6f))
                      }
                  } else {
                      LazyColumn(modifier = Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          items(runs, key = { it.id }) { run -> RunHistoryItem(run, useMph) { onDeleteRun(run) } }
                      }
                  }
              }
          }
          
          @Composable
          private fun RunHistoryItem(run: RunRecord, useMph: Boolean, onDelete: () -> Unit) {
              val dateFormat = remember { SimpleDateFormat("dd MMM yyyy · HH:mm:ss", Locale.getDefault()) }
              val mode = TestMode.entries.firstOrNull { it.name == run.testMode }
              Surface(shape = RoundedCornerShape(12.dp), color = MaterialTheme.colorScheme.surface) {
                  Column(Modifier.fillMaxWidth().padding(12.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Column(Modifier.weight(1f)) {
                              Text(mode?.title ?: run.testMode, color = MaterialTheme.colorScheme.primary, fontSize = 13.sp, fontWeight = FontWeight.Black, fontFamily = FontFamily.Monospace)
                              Text(dateFormat.format(Date(run.timestampEpochMs)), color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.6f), fontSize = 10.sp)
                          }
                          IconButton(onClick = onDelete) { Icon(Icons.Filled.Delete, contentDescription = "Delete run", tint = Color(0xFFD84343)) }
                      }
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.Bottom) {
                          Text(formatMsToSec(run.primaryTimeMs), fontSize = 26.sp, fontWeight = FontWeight.Black, fontFamily = FontFamily.Monospace)
                          Text(
                              if (mode?.kind == TestKind.BRAKING) formatDistance(run.totalDistanceM, useMph)
                              else if (mode?.kind == TestKind.DISTANCE) "@ ${formatSpeed(run.trapSpeedKmh, useMph)}"
                              else formatDistance(run.totalDistanceM, useMph),
                              color = MaterialTheme.colorScheme.secondary, fontSize = 13.sp, fontWeight = FontWeight.Bold
                          )
                      }
                      if (run.reactionTimeMs != null) Text("Reaction: ${formatSignedMs(run.reactionTimeMs)}", color = if (run.reactionTimeMs < 0) Color(0xFFD84343) else MaterialTheme.colorScheme.primary, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      Text("Peak G ${String.format(Locale.US, "%.2f", run.peakG)} · GPS ${String.format(Locale.US, "%.1f", run.gpsHz)} Hz · slope ${String.format(Locale.US, "%.2f", run.slopePercent)}%", color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.62f), fontSize = 10.sp)
                  }
              }
          }
          
          @Composable
          private fun MetricPill(label: String, value: String) {
              Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.widthIn(min = 64.dp)) {
                  Text(label, color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.58f), fontSize = 8.sp, fontFamily = FontFamily.Monospace)
                  Text(value, fontSize = 12.sp, fontWeight = FontWeight.Bold, fontFamily = FontFamily.Monospace)
              }
          }
          
          @Composable
          private fun SlipRow(label: String, value: String, highlight: Boolean = false) {
              Row(
                  modifier = Modifier.fillMaxWidth().padding(vertical = 2.dp),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Text(label, color = if (highlight) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurface.copy(alpha = 0.72f), fontSize = if (highlight) 11.sp else 10.sp, fontWeight = if (highlight) FontWeight.Bold else FontWeight.Normal, fontFamily = FontFamily.Monospace)
                  Text(value, color = if (highlight) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurface, fontSize = if (highlight) 12.sp else 10.sp, fontWeight = FontWeight.Bold, fontFamily = FontFamily.Monospace)
              }
          }
          
          private fun statusColor(status: RunStatus): Color = when (status) {
              RunStatus.IDLE -> Color(0xFF78909C)
              RunStatus.STAGED_STOP, RunStatus.STAGED_ROLL, RunStatus.STAGED_BRAKE -> Color(0xFFFFB300)
              RunStatus.RUNNING -> Color(0xFF00C853)
              RunStatus.COMPLETED -> Color(0xFF40C4FF)
          }
          
          private fun speedForDisplay(speedKmh: Double, useMph: Boolean): Double = if (useMph) speedKmh / 1.609344 else speedKmh
          private fun formatSpeed(speedKmh: Double, useMph: Boolean): String = String.format(Locale.US, "%.1f %s", speedForDisplay(speedKmh, useMph), if (useMph) "mph" else "km/h")
          private fun formatDistance(distanceM: Double, useMph: Boolean): String = if (useMph) String.format(Locale.US, "%.1f ft", distanceM * 3.28084) else String.format(Locale.US, "%.1f m", distanceM)
          private fun formatMsToSec(ms: Long): String = String.format(Locale.US, "%d.%03ds", ms / 1000, kotlin.math.abs(ms % 1000))
          private fun formatNullableMs(ms: Long?): String = ms?.let { formatMsToSec(it) } ?: "—.———"
          private fun formatSignedMs(ms: Long): String = (if (ms >= 0) "+" else "−") + String.format(Locale.US, "%d.%03ds", kotlin.math.abs(ms) / 1000, kotlin.math.abs(ms) % 1000)
          private fun averageBrakingG(run: RunRecord): Double {
              if (run.totalDistanceM <= 0.0) return 0.0
              val speedMps = run.trapSpeedKmh / 3.6
              return (speedMps * speedMps / (2.0 * run.totalDistanceM)) / 9.80665
          }
          
          private fun playGreenBeep() {
              try { ToneGenerator(AudioManager.STREAM_NOTIFICATION, 80).startTone(ToneGenerator.TONE_PROP_BEEP, 160) } catch (_: Exception) { }
          }
          
          private fun shareRunsAsCsv(context: Context, runs: List<RunRecord>) {
              val sb = StringBuilder()
              sb.appendLine("ID,Timestamp,Mode,PrimaryTime_s,TrapSpeed_kmh,Distance_m,60ft_s,330ft_s,EighthMile_s,EighthSpeed_kmh,1000ft_s,0_100_s,100_150_s,150_200_s,Slope_pct,ValidSlope,PeakG,Rollout,GPS_Hz,Reaction_ms")
              for (r in runs) {
                  sb.appendLine(
                      "${r.id},${r.timestampEpochMs},${r.testMode},${r.primaryTimeMs / 1000.0},${r.trapSpeedKmh},${r.totalDistanceM}," +
                          "${r.time60ftMs?.div(1000.0) ?: ""},${r.time330ftMs?.div(1000.0) ?: ""},${r.timeEighthMileMs?.div(1000.0) ?: ""},${r.speedEighthMileKmh ?: ""}," +
                          "${r.time1000ftMs?.div(1000.0) ?: ""},${r.time0to100Ms?.div(1000.0) ?: ""},${r.time100to150Ms?.div(1000.0) ?: ""},${r.time150to200Ms?.div(1000.0) ?: ""}," +
                          "${r.slopePercent},${r.isValidSlope},${r.peakG},${r.rolloutEnabled},${r.gpsHz},${r.reactionTimeMs ?: ""}"
                  )
              }
              val sendIntent = Intent(Intent.ACTION_SEND).apply {
                  type = "text/csv"
                  putExtra(Intent.EXTRA_SUBJECT, "GPS Performance Runs Telemetry CSV")
                  putExtra(Intent.EXTRA_TEXT, sb.toString())
              }
              context.startActivity(Intent.createChooser(sendIntent, "Export Telemetry CSV"))
          }
          EOF

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Drag-Timer-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "GPS Drag Timer Build #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
