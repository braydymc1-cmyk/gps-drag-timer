          @Composable
          private fun GpsStatusBar(uiState: TelemetryUiState) {
              val good = uiState.satellitesUsed >= 10 && uiState.accuracyM <= 3.5f
              val medium = uiState.satellitesUsed >= 6
              val statusColor = if (good) Color(0xFF00C853) else if (medium) Color(0xFFFFB300) else Color(0xFFD84343)
              Row(
                  modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(10.dp)).background(MaterialTheme.colorScheme.surface).padding(horizontal = 12.dp, vertical = 9.dp),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Box(Modifier.size(8.dp).clip(CircleShape).background(statusColor))
                      Spacer(Modifier.width(7.dp))
                      Text("SATS ${uiState.satellitesUsed}/${uiState.satellitesVisible}", fontSize = 11.sp, fontFamily = FontFamily.Monospace, fontWeight = FontWeight.Bold)
                  }
                  Text("±${String.format(Locale.US, "%.1f", uiState.accuracyM)} m", fontSize = 11.sp, color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.75f), fontFamily = FontFamily.Monospace)
                  Text(String.format(Locale.US, "%.1f Hz", uiState.currentHz), fontSize = 11.sp, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold, fontFamily = FontFamily.Monospace)
              }
          }
          
          @Composable
          private fun LiveTelemetryScreen(
              uiState: TelemetryUiState,
              settings: AppSettings,
              treePhase: Int,
              treeSequenceRunning: Boolean,
              onToggleRollout: (Boolean) -> Unit,
              onArmToggle: () -> Unit,
              onOpenHome: () -> Unit,
              onOpenSettings: () -> Unit
          ) {
              Column(modifier = Modifier.fillMaxSize()) {
                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth()) {
                      Column(Modifier.weight(1f)) {
                          Text(uiState.mode.title, fontSize = 18.sp, fontWeight = FontWeight.Black, fontFamily = FontFamily.Monospace)
                          Text(uiState.status.label, fontSize = 10.sp, color = statusColor(uiState.status), fontWeight = FontWeight.Bold, fontFamily = FontFamily.Monospace)
                      }
                      TextButton(onClick = onOpenHome) { Icon(Icons.Filled.ArrowBack, null); Text("MODES") }
                      IconButton(onClick = onOpenSettings) { Icon(Icons.Filled.Settings, contentDescription = "Settings") }
                  }
                  Spacer(Modifier.height(8.dp))
                  if (uiState.mode.kind == TestKind.DISTANCE) {
                      Row(
                          Modifier.fillMaxWidth().clip(RoundedCornerShape(8.dp)).background(MaterialTheme.colorScheme.surface).padding(horizontal = 10.dp, vertical = 4.dp),
                          horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text("1-FT ROLLOUT (${if (settings.useMph) "0.3 m" else "0.30 m"})", fontSize = 10.sp, fontFamily = FontFamily.Monospace)
                          Switch(checked = uiState.rolloutEnabled, onCheckedChange = onToggleRollout)
                      }
                      Spacer(Modifier.height(8.dp))
                  }
                  if (uiState.mode.hasTree) {
                      DragTreePanel(treePhase, treeSequenceRunning, uiState.reactionTimeMs)
                      Spacer(Modifier.height(8.dp))
                  }
                  Surface(shape = RoundedCornerShape(14.dp), color = MaterialTheme.colorScheme.surface, tonalElevation = 1.dp) {
                      Column(Modifier.fillMaxWidth().padding(14.dp)) {
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.Bottom) {
                              Column {
                                  Text("GPS SPEED", color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.6f), fontSize = 10.sp, fontFamily = FontFamily.Monospace)
                                  Row(verticalAlignment = Alignment.Bottom) {
                                      Text(String.format(Locale.US, "%.1f", speedForDisplay(uiState.currentSpeedKmh, settings.useMph)), fontSize = 40.sp, fontWeight = FontWeight.Black, fontFamily = FontFamily.Monospace)
                                      Spacer(Modifier.width(5.dp))
                                      Text(if (settings.useMph) "MPH" else "KM/H", color = MaterialTheme.colorScheme.primary, fontSize = 12.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(bottom = 6.dp))
                                  }
                              }
                              Column(horizontalAlignment = Alignment.End) {
                                  Text("ELAPSED", color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.6f), fontSize = 10.sp, fontFamily = FontFamily.Monospace)
                                  Text(formatMsToSec(uiState.liveElapsedMs), fontSize = 32.sp, fontWeight = FontWeight.Black, color = MaterialTheme.colorScheme.primary, fontFamily = FontFamily.Monospace)
                              }
                          }
                          Spacer(Modifier.height(8.dp))
                          HorizontalDivider(color = MaterialTheme.colorScheme.outline.copy(alpha = 0.4f))
                          Spacer(Modifier.height(9.dp))
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                              MetricPill("DISTANCE", formatDistance(uiState.liveDistanceM, settings.useMph))
                              MetricPill("LIVE G", String.format(Locale.US, "%.2f G", uiState.currentG))
                              MetricPill(if (uiState.mode.kind == TestKind.BRAKING) "PEAK DECEL" else "PEAK G", String.format(Locale.US, "%.2f G", uiState.peakG))
                          }
                          if (uiState.mode.hasTree && uiState.reactionTimeMs != null) {
                              Spacer(Modifier.height(8.dp))
                              Text(
                                  if (uiState.reactionTimeMs < 0) "RED LIGHT · ${formatSignedMs(uiState.reactionTimeMs)}" else "REACTION TIME · ${formatSignedMs(uiState.reactionTimeMs)}",
                                  color = if (uiState.reactionTimeMs < 0) Color(0xFFFF5252) else MaterialTheme.colorScheme.primary,
                                  fontFamily = FontFamily.Monospace, fontWeight = FontWeight.Black, fontSize = 14.sp
                              )
                          }
                      }
                  }
                  Spacer(Modifier.height(8.dp))
                  TimeSlipCard(mode = uiState.mode, run = uiState.latestRun, settings = settings, modifier = Modifier.weight(1f, fill = false))
                  Spacer(Modifier.height(8.dp))
                  val actionText = when {
                      uiState.status == RunStatus.IDLE || uiState.status == RunStatus.COMPLETED -> "ARM ${if (uiState.mode.hasTree) "DRAG TREE" else "TIMER"}"
                      uiState.mode.hasTree && uiState.status == RunStatus.STAGED_STOP && !treeSequenceRunning && treePhase != 6 -> "START TREE"
                      uiState.mode.hasTree && uiState.status == RunStatus.STAGED_STOP && treePhase == 6 -> "RUN TREE AGAIN"
                      treeSequenceRunning -> "TREE SEQUENCE RUNNING…"
                      else -> "ABORT / DISARM"
                  }
                  Button(
                      onClick = onArmToggle,
                      enabled = !treeSequenceRunning || uiState.status == RunStatus.RUNNING,
                      modifier = Modifier.fillMaxWidth().height(52.dp),
                      shape = RoundedCornerShape(11.dp),
                      colors = ButtonDefaults.buttonColors(
                          containerColor = if (uiState.status == RunStatus.RUNNING) Color(0xFFD84343) else MaterialTheme.colorScheme.primary,
                          contentColor = if (uiState.status == RunStatus.RUNNING) Color.White else if (settings.darkTheme) Color.Black else Color.White
                      )
                  ) {
                      Text(actionText, fontSize = 15.sp, fontWeight = FontWeight.Black, fontFamily = FontFamily.Monospace)
                  }
                  Spacer(Modifier.height(5.dp))
                  if (settings.showGpsDiagnostics) {
                      Text(
                          "GPS ESTIMATE · accuracy ${String.format(Locale.US, "%.1f", uiState.accuracyM)} m · ${String.format(Locale.US, "%.1f", uiState.currentHz)} Hz",
                          modifier = Modifier.fillMaxWidth(), textAlign = androidx.compose.ui.text.style.TextAlign.Center,
                          color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.55f), fontSize = 9.sp, fontFamily = FontFamily.Monospace
                      )
                  }
              }
          }
          
          @Composable
          private fun DragTreePanel(phase: Int, running: Boolean, reactionTimeMs: Long?) {
              Surface(shape = RoundedCornerShape(12.dp), color = Color(0xFF101418), border = androidx.compose.foundation.BorderStroke(1.dp, Color(0xFF343B42))) {
                  Row(Modifier.fillMaxWidth().padding(10.dp), verticalAlignment = Alignment.CenterVertically) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.weight(1f)) {
                          Text("PRE-STAGE", color = Color.LightGray, fontSize = 8.sp, fontFamily = FontFamily.Monospace)
                          LightBulb(phase >= 1, Color(0xFFFFE082))
                          Spacer(Modifier.height(3.dp))
                          Text("STAGE", color = Color.LightGray, fontSize = 8.sp, fontFamily = FontFamily.Monospace)
                          LightBulb(phase >= 2, Color(0xFFFFE082))
                      }
                      Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.weight(1.1f)) {
                          Text("SPORTSMAN TREE", color = Color(0xFFB0BEC5), fontSize = 9.sp, fontWeight = FontWeight.Bold, fontFamily = FontFamily.Monospace)
                          Row(horizontalArrangement = Arrangement.spacedBy(7.dp), verticalAlignment = Alignment.CenterVertically) {
                              LightBulb(phase >= 3 && phase < 6, Color(0xFFFFB300))
                              LightBulb(phase >= 4 && phase < 6, Color(0xFFFFB300))
                              LightBulb(phase >= 5 && phase < 6, Color(0xFFFFB300))
                          }
                          Spacer(Modifier.height(4.dp))
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              LightBulb(phase == 6, Color(0xFF00E676), size = 24.dp)
                              Text(if (phase == 6) "GREEN" else if (running) "COUNTDOWN" else "READY WHEN ARMED", color = if (phase == 6) Color(0xFF00E676) else Color(0xFFB0BEC5), fontSize = 9.sp, fontWeight = FontWeight.Black, fontFamily = FontFamily.Monospace)
                          }
                      }
                      Column(horizontalAlignment = Alignment.End, modifier = Modifier.weight(1f)) {
                          Text("REACTION", color = Color(0xFFB0BEC5), fontSize = 8.sp, fontFamily = FontFamily.Monospace)
                          Text(
                              reactionTimeMs?.let { formatSignedMs(it) } ?: "—.———",
                              color = if (reactionTimeMs != null && reactionTimeMs < 0) Color(0xFFFF5252) else Color(0xFF00E676),
                              fontSize = 16.sp, fontWeight = FontWeight.Black, fontFamily = FontFamily.Monospace
                          )
                          Text(if (reactionTimeMs != null && reactionTimeMs < 0) "RED LIGHT" else "GPS MOVEMENT", color = Color(0xFFB0BEC5), fontSize = 7.sp)
                      }
                  }
              }
          }
          
          @Composable
          private fun LightBulb(on: Boolean, onColor: Color, size: androidx.compose.ui.unit.Dp = 17.dp) {
              Box(
                  Modifier.size(size).clip(CircleShape).background(if (on) onColor else Color(0xFF292F34))
                      .border(1.dp, if (on) onColor else Color(0xFF4A5258), CircleShape)
              )
          }
          
          @Composable
          private fun TimeSlipCard(mode: TestMode, run: RunRecord?, settings: AppSettings, modifier: Modifier = Modifier) {
              Surface(modifier = modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp), color = MaterialTheme.colorScheme.surface) {
                  Column(Modifier.padding(12.dp)) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          Text("DIGITAL TIME SLIP", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Black, fontSize = 12.sp, fontFamily = FontFamily.Monospace)
                          if (run != null) Text(if (run.isValidSlope) "SLOPE OK*" else "CHECK SLOPE*", color = if (run.isValidSlope) MaterialTheme.colorScheme.primary else Color(0xFFFF5252), fontWeight = FontWeight.Bold, fontSize = 9.sp)
                      }
                      Spacer(Modifier.height(5.dp))
                      HorizontalDivider(color = MaterialTheme.colorScheme.outline.copy(alpha = 0.35f))
                      Spacer(Modifier.height(5.dp))
                      if (mode.kind == TestKind.DISTANCE) {
                          if (mode.targetDistanceM >= TimingConstants.DIST_QUARTER_MILE_M - 1.0) {
                              SlipRow("60 FT", formatNullableMs(run?.time60ftMs))
                              SlipRow("330 FT", formatNullableMs(run?.time330ftMs))
                              SlipRow("1/8 MILE", if (run?.timeEighthMileMs != null) "${formatMsToSec(run.timeEighthMileMs)} @ ${formatSpeed(run.speedEighthMileKmh ?: 0.0, settings.useMph)}" else "—.———")
                              SlipRow("1000 FT", formatNullableMs(run?.time1000ftMs))
                          }
                          SlipRow(mode.title, if (run != null && run.testMode == mode.name) formatMsToSec(run.primaryTimeMs) else "—.———", true)
                          SlipRow("FINISH SPEED", if (run != null && run.testMode == mode.name) formatSpeed(run.trapSpeedKmh, settings.useMph) else "—")
                          if (mode.hasTree) SlipRow("REACTION TIME", if (run?.reactionTimeMs != null) formatSignedMs(run.reactionTimeMs) else "—.———", true)
                      } else if (mode.kind == TestKind.ACCEL_SPEED) {
                          SlipRow("TOTAL TIME", if (run != null && run.testMode == mode.name) formatMsToSec(run.primaryTimeMs) else "—.———", true)
                          SlipRow("DISTANCE", if (run != null && run.testMode == mode.name) formatDistance(run.totalDistanceM, settings.useMph) else "—")
                          SlipRow("TARGET SPEED", formatSpeed(mode.finishSpeedKmh, settings.useMph))
                      } else if (mode.kind == TestKind.ROLL_SPEED) {
                          if (mode == TestMode.ROLL_100_200) {
                              SlipRow("100–150 KM/H", formatNullableMs(run?.time100to150Ms))
                              SlipRow("150–200 KM/H", formatNullableMs(run?.time150to200Ms))
                          }
                          SlipRow("${mode.title} TIME", if (run != null && run.testMode == mode.name) formatMsToSec(run.primaryTimeMs) else "—.———", true)
                          SlipRow("ROLL DISTANCE", if (run != null && run.testMode == mode.name) formatDistance(run.totalDistanceM, settings.useMph) else "—")
                      } else {
                          SlipRow("BRAKING TIME", if (run != null && run.testMode == mode.name) formatMsToSec(run.primaryTimeMs) else "—.———", true)
                          SlipRow("START SPEED", formatSpeed(mode.startSpeedKmh, settings.useMph))
                          SlipRow("STOPPING DISTANCE", if (run != null && run.testMode == mode.name) formatDistance(run.totalDistanceM, settings.useMph) else "—", true)
                          SlipRow("PEAK DECELERATION", if (run != null && run.testMode == mode.name) String.format(Locale.US, "%.2f G", run.peakG) else "—")
                          SlipRow("AVERAGE DECELERATION", if (run != null && run.testMode == mode.name && run.totalDistanceM > 0.0) String.format(Locale.US, "%.2f G", averageBrakingG(run)) else "—")
                      }
                      if (run != null && run.testMode == mode.name) {
                          Spacer(Modifier.height(4.dp))
                          Text("GPS ${String.format(Locale.US, "%.1f", run.gpsHz)} Hz · SLOPE ${String.format(Locale.US, "%.2f", run.slopePercent)}% · PEAK ${String.format(Locale.US, "%.2f", run.peakG)} G", fontSize = 8.sp, color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.55f), fontFamily = FontFamily.Monospace)
                      } else {
                          Text("Results appear here after a completed pass.", fontSize = 9.sp, color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.5f))
                      }
                      Text("*Slope flag is only a basic GPS altitude check, not official track validation.", fontSize = 8.sp, color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.48f))
                  }
              }
          }
          
          @Composable
          private fun SettingsScreen(settings: AppSettings, onChange: (AppSettings) -> Unit) {
              Column(modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState())) {
                  Text("DISPLAY", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Black, fontSize = 11.sp)
                  SettingSwitch("Dark theme", "Switch between dark and light appearance", settings.darkTheme) { onChange(settings.copy(darkTheme = it)) }
                  SettingSwitch("Use MPH", "Display speeds and distances in imperial units where applicable", settings.useMph) { onChange(settings.copy(useMph = it)) }
                  Spacer(Modifier.height(10.dp))
                  Text("TIMING", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Black, fontSize = 11.sp)
                  SettingSwitch("1-foot rollout", "For standing-start distance tests, start ET after the first foot", settings.rolloutEnabled) { onChange(settings.copy(rolloutEnabled = it)) }
                  SettingSwitch("GPS diagnostics", "Show satellite count, estimated accuracy and sample rate", settings.showGpsDiagnostics) { onChange(settings.copy(showGpsDiagnostics = it)) }
                  SettingSwitch("Beep on green", "Play a short tone when the drag tree turns green", settings.beepOnGreen) { onChange(settings.copy(beepOnGreen = it)) }
                  Spacer(Modifier.height(12.dp))
                  Surface(shape = RoundedCornerShape(12.dp), color = MaterialTheme.colorScheme.surface) {
                      Column(Modifier.padding(14.dp)) {
                          Text("ABOUT GPS TIMING", fontSize = 12.sp, fontWeight = FontWeight.Black)
                          Spacer(Modifier.height(6.dp))
                          Text(
                              "The app interpolates between Android GPS fixes to estimate elapsed times, trap speed and stopping distance. Accuracy depends on the phone, sky view, GPS update rate and conditions. The drag-tree reaction time is based on detected GPS movement, not a track beam, and may be delayed by GPS sampling. For repeatable results, use a high-rate external GNSS receiver and compare against official timing equipment.",
                              fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.75f)
                          )
                          Spacer(Modifier.height(8.dp))
                          Text("Use only on a closed course in a safe, legal environment.", fontSize = 11.sp, fontWeight = FontWeight.Bold, color = Color(0xFFD84343))
                      }
                  }
                  Spacer(Modifier.height(18.dp))
              }
          }
          
          @Composable
          private fun SettingSwitch(title: String, description: String, checked: Boolean, onCheckedChange: (Boolean) -> Unit) {
              Row(
                  modifier = Modifier.fillMaxWidth().padding(vertical = 5.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
